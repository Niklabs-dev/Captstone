name: Sprint 4 - T08 Cierres de caja por turno

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sprint-4-t08-cierres-caja.yml"
      - "Fase 2/Evidencias Proyecto/Evidencias de sistema Aplicación/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-4-t08-cash-closings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    name: Migración, reversa y PostgreSQL real
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # bash de Actions corre con -eo pipefail: cualquier fallo corta el job
        shell: bash
        working-directory: Fase 2/Evidencias Proyecto/Evidencias de sistema Aplicación/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: subway_gestion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d subway_gestion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Base efímera del runner: prisma.config.ts y los specs leen estas URL
      DATABASE_URL: postgresql://postgres:ci-disposable-password@127.0.0.1:5432/subway_gestion
      MIGRATION_NAME: 20261104010649_cierres_caja_turno_conciliacion
      MIGRATION_DIR: prisma/migrations/20261104010649_cierres_caja_turno_conciliacion
      REPORTS_DIR: ${{ github.workspace }}/ci-output
    steps:
      - uses: actions/checkout@v7
        with:
          # Historial completo para obtener el schema previo a la migración
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Fase 2/Evidencias Proyecto/Evidencias de sistema Aplicación/backend/package-lock.json
      - name: Instalar dependencias del backend
        run: |
          npm ci
          mkdir -p "$REPORTS_DIR"
      - name: Aplicar todas las migraciones desde cero
        run: npx prisma migrate deploy
      - name: Probar cierres de caja y restricciones con PostgreSQL real
        run: |
          # Los specs se omiten sin TEST_DATABASE_URL: el reporte JSON confirma
          # que corrieron todos los casos y que ninguno quedó omitido.
          TEST_DATABASE_URL="$DATABASE_URL" npx vitest run \
            test/cash-closings.integration.spec.ts \
            test/database.integration.spec.ts \
            --maxWorkers=1 \
            --reporter=default --reporter=json \
            --outputFile.json="$REPORTS_DIR/integration-before-down.json"
          jq -e '.success and .numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' \
            "$REPORTS_DIR/integration-before-down.json"
      - name: Revertir la migración con down.sql
        run: npx prisma db execute --file "$MIGRATION_DIR/down.sql"
      - name: Verificar que la reversa no deja drift
        run: |
          # Schema anterior a la migración: el del padre del commit que la agregó
          # (en el PR coincide con el de origin/main).
          added_in=$(git log --diff-filter=A --format=%H -1 -- "$MIGRATION_DIR/migration.sql")
          test -n "$added_in"
          git show "${added_in}^:./prisma/schema.prisma" > "$RUNNER_TEMP/schema-before.prisma"
          # --exit-code: 0 sin diferencias, 2 con diferencias, 1 error
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema "$RUNNER_TEMP/schema-before.prisma" \
            --script --exit-code
          # migrate status sale con código distinto de 0 si hay migraciones
          # pendientes: aquí debe estarlo justamente la de este cierre.
          if npx prisma migrate status > "$REPORTS_DIR/migrate-status.txt" 2>&1; then
            cat "$REPORTS_DIR/migrate-status.txt"
            echo "::error::La migración $MIGRATION_NAME debería quedar pendiente tras down.sql"
            exit 1
          fi
          cat "$REPORTS_DIR/migrate-status.txt"
          grep -q "$MIGRATION_NAME" "$REPORTS_DIR/migrate-status.txt"
      - name: Reaplicar la migración y repetir las pruebas de cierres
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
          TEST_DATABASE_URL="$DATABASE_URL" npx vitest run \
            test/cash-closings.integration.spec.ts \
            --maxWorkers=1 \
            --reporter=default --reporter=json \
            --outputFile.json="$REPORTS_DIR/cash-closings-after-redeploy.json"
          jq -e '.success and .numTotalTests > 0 and .numPendingTests == 0 and .numTodoTests == 0' \
            "$REPORTS_DIR/cash-closings-after-redeploy.json"
      - name: Adjuntar reportes de las pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sprint-4-t08-cash-closings-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: ci-output
