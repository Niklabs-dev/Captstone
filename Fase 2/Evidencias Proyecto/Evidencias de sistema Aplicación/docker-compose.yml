# Levanta el sistema completo: PostgreSQL + backend NestJS + frontend Next.js
# Uso: docker compose up --build
# Los valores por defecto permiten levantar sin pasos manuales en desarrollo;
# en producción se sobrescriben con un archivo .env (ver backend/.env.example).
#
# Compatible con Coolify: los servicios solo declaran `expose` (puertos
# internos de la red Docker) y no publican puertos en el host; Coolify enruta el
# dominio al frontend con su proxy. Tampoco se fija `container_name`, para que
# los entornos de pruebas y producción convivan en el mismo servidor sin
# chocar. En local, docker-compose.override.yml (se aplica solo) publica los
# puertos 5433, 3001 y 3000.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar-en-produccion}
      POSTGRES_DB: ${DB_NAME:-subway_gestion}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-cambiar-en-produccion}
      DB_NAME: ${DB_NAME:-subway_gestion}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-cambiar-en-produccion}@db:5432/${DB_NAME:-subway_gestion}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      DOCUMENTS_STORAGE_PATH: /app/storage/documents
    # Archivos del gestor documental en un volumen propio, separado del de
    # PostgreSQL: se conservan al menos 5 años (art. 9 bis CT) y se respaldan
    # aparte (ver README, "Respaldo de los volúmenes").
    volumes:
      - documents_data:/app/storage/documents
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplica las migraciones de Prisma una sola vez antes de levantar el backend
  migrate:
    build:
      context: ./backend
      target: deps
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-cambiar-en-produccion}@db:5432/${DB_NAME:-subway_gestion}
    depends_on:
      db:
        condition: service_healthy
    command: npx prisma migrate deploy

  # Carga los datos base (roles y usuario administrador) tras las migraciones.
  # El seed es idempotente: no duplica roles ni sobrescribe la contraseña del
  # administrador si ya existe.
  seed:
    build:
      context: ./backend
      target: deps
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-cambiar-en-produccion}@db:5432/${DB_NAME:-subway_gestion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@moi-food.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-cambiar-en-produccion}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Administrador}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Moi-food}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: npx prisma db seed

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:3001
      AUTH_REFRESH_COOKIE_MAX_AGE: ${AUTH_REFRESH_COOKIE_MAX_AGE:-604800}
      # Locales creados por el seed (BASE_STORES en backend/prisma/seed.ts, con
      # los mismos UUID). Valor literal y no ${VAR:-...}: las llaves del JSON
      # no deben depender de cómo cada herramienta interpola el valor por defecto.
      AUDIT_STORES: '[{"id":"1010021e-9bab-42d5-851c-417e9e2503bf","name":"Santa María"},{"id":"73b590e0-11b2-4781-ba7b-4f7f8c2c6e35","name":"Ugalde"},{"id":"9ba7ac40-9463-47ec-b0b1-e53c79a185f9","name":"Calera"}]'
      USER_MANAGEMENT_STORES: '[{"id":"1010021e-9bab-42d5-851c-417e9e2503bf","name":"Santa María"},{"id":"73b590e0-11b2-4781-ba7b-4f7f8c2c6e35","name":"Ugalde"},{"id":"9ba7ac40-9463-47ec-b0b1-e53c79a185f9","name":"Calera"}]'
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_started
    # 127.0.0.1 y no localhost: Next.js escucha solo en IPv4 (HOSTNAME=0.0.0.0)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  documents_data:
